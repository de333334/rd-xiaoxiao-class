<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册营养师 · 晓晓老师课堂（维生素·今日新课）</title>
<style>
  :root{
    --bg:#f3f7fb; --card:#ffffff; --ink:#23303f; --sub:#5b6b7c;
    --brand:#ff7a59; --brand2:#ffb347; --green:#39b27c; --blue:#3a86ff;
    --purple:#8a5cff; --soft:#eef4fb; --line:#e2ebf3;
  }
  *{box-sizing:border-box;}
  /* 字体：宋体（SimSun）小四号≈16px，清晰大字 */
  html,body{margin:0;padding:0;
    font-family:"宋体","SimSun","Songti SC","STSong","Microsoft YaHei",serif;
    background:var(--bg);color:var(--ink);font-size:16px;}
  /* 顶部条 */
  .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#ff8a65,#ffb347);
    color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);flex-wrap:wrap;}
  .avatar{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .titles{line-height:1.25;flex:1;min-width:160px;}
  .titles b{font-size:17px;}
  .titles small{opacity:.92;font-size:12.5px;}
  .score-chip{background:rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-weight:700;font-size:15px;}
  .ctrls{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:none;border-radius:20px;padding:8px 13px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;
    background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:.15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{background:rgba(255,255,255,.22);color:#fff;}
  .btn.on{background:#fff;color:var(--green);}

  /* 进度 */
  .progress{height:5px;background:#ffe1d3;}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,#39b27c,#3a86ff);width:0;transition:.3s;}

  /* 主体（底部留白给字幕控制条，字幕不挡讲解） */
  .stage{max-width:840px;margin:0 auto;padding:18px 16px 200px;}
  .navmap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .navmap button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit;}
  .navmap button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .navmap button.done{background:var(--soft);color:var(--green);border-color:#bfe6d6;}

  .slide{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(35,48,63,.06);animation:pop .35s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .slide h2{margin:0 0 4px;font-size:24px;display:flex;align-items:center;gap:8px;}
  .slide .tag{font-size:13px;color:var(--brand);background:#fff0ea;padding:3px 9px;border-radius:10px;font-weight:700;}
  .slide p{line-height:1.95;font-size:16px;color:var(--ink);}
  .slide .lead{color:var(--sub);font-size:15px;margin-top:0;}

  .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--soft);font-size:15.5px;line-height:1.8;}
  .card.ask{background:#fff7ec;border-color:#ffe2b3;}
  .card.tip{background:#eef9f3;border-color:#cdeede;}
  .card b{color:var(--brand);}

  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;}
  th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;}
  th{background:var(--soft);color:var(--sub);font-weight:700;}
  td .ico{font-size:18px;margin-right:6px;}

  .mnemonic{background:linear-gradient(135deg,#fff3ec,#fff8e8);border-left:5px solid var(--brand);
    border-radius:12px;padding:13px 16px;margin:12px 0;font-size:17px;font-weight:700;color:#b5431f;line-height:1.7;}
  .mnemonic small{display:block;font-weight:400;color:var(--sub);font-size:13.5px;margin-top:4px;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit;}

  .pager{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
  .pager .btn{padding:11px 18px;font-size:15px;}

  /* 案例图 */
  .case{border:1px dashed var(--brand);border-radius:14px;padding:12px 14px;margin:14px 0;background:#fffdfb;}
  .case-title{font-weight:700;color:var(--brand);font-size:15px;margin-bottom:8px;}
  .case svg{width:100%;height:auto;display:block;}
  .case-cap{font-size:13.5px;color:var(--sub);margin-top:6px;}

  /* 底部字幕 + 播放位置控制条 —— 固定底部，半透明，不遮挡讲解区 */
  .subtitle{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(20,28,38,.86);
    color:#fff;padding:10px 16px 12px;font-size:17px;line-height:1.6;backdrop-filter:blur(6px);
    border-top:1px solid rgba(255,255,255,.15);min-height:104px;display:flex;flex-direction:column;gap:8px;}
  .sub-row1{display:flex;align-items:center;gap:10px;}
  .sub-row1 .spk{font-size:20px;}
  .sub-row1 .txt{flex:1;}
  .sub-row1 .cur{background:#ffd24d;color:#222;border-radius:4px;padding:0 2px;}
  .sub-row1 .pos{font-size:13px;opacity:.8;white-space:nowrap;}
  .sub-row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sbtn{border:none;border-radius:18px;padding:7px 13px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;
    background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .sbtn:hover{transform:translateY(-1px);}
  .sbtn.play{background:var(--green);color:#fff;}
  .sentbar{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
  .seg{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;
    min-width:26px;padding:4px 0;font-size:12px;cursor:pointer;font-family:inherit;text-align:center;}
  .seg.done{background:rgba(57,178,124,.55);border-color:rgba(57,178,124,.8);}
  .seg.on{background:#ffd24d;color:#222;border-color:#ffd24d;font-weight:700;}

  /* 弹窗（测验 / 费曼 / 小明 / 复习） */
  .mask{position:fixed;inset:0;background:rgba(20,28,38,.55);z-index:40;display:none;align-items:center;justify-content:center;padding:18px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:inherit;}
  .modal h3{margin:0 0 6px;font-size:21px;}
  .modal .who{font-size:13.5px;color:var(--sub);margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:12px 14px;margin:8px 0;font-size:15.5px;cursor:pointer;transition:.15s;font-family:inherit;}
  .opt:hover{border-color:var(--brand);}
  .opt.correct{background:#eafaf1;border-color:var(--green);color:#1c7a4d;}
  .opt.wrong{background:#fdeaea;border-color:#e06b6b;color:#b33232;}
  .opt:disabled{cursor:default;}
  .explain{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14.5px;line-height:1.8;display:none;}
  .explain.show{display:block;}
  .modal .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14.5px;font-family:inherit;resize:vertical;}
  .stars{font-size:26px;letter-spacing:4px;cursor:pointer;}
  .stars span{color:#d9d9d9;}
  .stars span.lit{color:#ffb347;}

  .badge{display:inline-block;background:#fff0ea;color:var(--brand);border-radius:12px;padding:4px 10px;font-size:12.5px;margin:3px;font-weight:700;}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#23303f;color:#fff;
    padding:10px 18px;border-radius:24px;z-index:60;font-size:14px;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .feynman-list li{margin:8px 0;line-height:1.8;font-size:15.5px;}
  .ok{color:var(--green);font-weight:700;}
  .foot{text-align:center;color:var(--sub);font-size:12.5px;margin:6px 0 0;}
</style>
</head>

</head>
<body>

<div class="topbar">
  <div class="avatar">👩‍🏫</div>
  <div class="titles"><b>注册营养师 · 晓晓老师课堂（维生素·专题）</b><br><small>今日新课：维生素（是什么/脂溶vs水溶/脂溶四兄弟ADEK/水溶B族+C/来源/误区）</small></div>
  <div class="score-chip">⭐ <span id="score">0</span></div>
  <div class="ctrls">
    <button class="btn" id="playBtn">▶ 听晓晓老师讲（本课）</button>
    <select class="btn" id="voiceSel" title="选择晓晓老师的声音"></select>
    <select class="btn" id="rateSel" title="语速（可调速）"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option></select>
    <button class="btn ghost" id="rollBtn" title="随机抽一道题考考你">🎲 考考我</button>

</div>

</div>

    <span class="spk">🔊</span>

    <span class="pos" id="posTxt">句 0/0</span>
  </div>
  <div class="sub-row2">
    <button class="sbtn" id="prevS">⏮ 上一句</button>
    <button class="sbtn play" id="playS">▶ 播放</button>
    <button class="sbtn" id="nextS">下一句 ⏭</button>

  </div>
</div>

  <div class="modal" id="modal"></div>
</div>

<script>
const LESSONS = [{"id":"open","title":"👋 开场白","tag":"第0站 · 地图","narr":"同学们好，我是晓晓老师。前面几课咱们把\"产能大军\"学完了：蛋白质（砖块）、脂类（油家族）、能量（汽油）、碳水化合物（主燃料）、膳食纤维（清道夫），还有昨天的谷类主食（餐桌大老板）。今天这道新菜，是身体里的\"微量调节兵\"——维生素（Vitamins）。它不供能、不建身体，却管着看东西、长骨头、凝血、抗氧、防贫血……少了哪一种，小毛病就找上门。它分脂溶性（A D E K）和水溶性（B族 + C）两大家。跟着晓晓老师：先复习昨天和前面的口诀，搞懂维生是什么、分哪两类、脂溶四兄弟怎么记、水溶家族有谁、从哪来、避开误区，最后费曼自检、小明提问、来场测验。出发！","html":"<p class=\"lead\">今天学身体里的\"微量调节兵\" 🪖——维生素（Vitamins）</p>\n    <div class=\"card ask\"><b>晓晓老师：</b>先唤醒旧口诀，再学维生素这道\"小管家菜\"。哪怕初中生也能听懂、记住、讲给别人听。</div>\n    <div class=\"mnemonic\">学习路线：复习口诀 → 是什么 → 两大类(脂溶/水溶) → 脂溶四兄弟(ADEK) → 水溶(B族+C) → 从哪来 → 误区 → 费曼自检 → 小明互动 → 终极测验<small>跟着导航条走，每一站都有口诀和提问。</small></div>"},{"id":"review","title":"🔁 复习站（唤醒旧课）","tag":"复习 · 唤醒口诀","narr":"先复习！昨天的谷类主食：碳水底座、三兄弟（精白全谷杂豆）、粗细搭配加米豆互补补赖氨酸，一天谷类200到300克、薯类50到100克。前天的膳食纤维：只存在于植物、不升糖不供能，可溶果冻控糖脂、不可溶扫把通便，一天25到30克。再唤醒地基：蛋脂碳维矿水纤，七兄弟——今天的主角\"维\"（维生素）就在里面，它是微量调节兵。点下面按钮先考考自己。","html":"<p class=\"lead\">唤醒旧口诀，再学维生素 🔔</p>\n    <div class=\"mnemonic\">谷类主食是底座，碳水八九成是它；粗细搭配饭更香，米加豆子蛋白强。<small>昨天的谷类主食课，先唤醒。</small></div>\n    <div class=\"mnemonic\">膳食纤维植物藏，不升血糖不供能；可溶果冻控糖脂，不可溶把肠道扫。<small>前天的纤维课，先唤醒。</small></div>\n    <div class=\"mnemonic\">蛋脂碳维矿水纤，七兄弟把健康连！<small>维=维生素，今天的主角，是\"微量调节兵\"。</small></div>\n    <button class=\"btn\" onclick=\"openReview()\">📋 旧口诀小测（3问）</button>"},{"id":"vwhat","title":"🪖 维生素是身体的\"微量调节兵\"","tag":"第1站 · 是什么","narr":"维生素，是身体需要的\"微量营养素\"——注意两个字：\"微\"量。它和蛋白质、脂类、碳水不一样：一不供能（不能当汽油烧），二不盖房子（不组成肌肉骨骼这些大结构），它干的是\"调节\"的活——当辅酶帮酶干活、当抗氧化兵保护细胞、帮你看清黑夜、帮骨头抓钙。一句话：它像身体里的\"小管家 + 调节器\"，用量极少（毫克、微克级），但缺了哪一种，代谢紊乱、小病就来了。记住：维生素不顶饿，但少了不行。","html":"<p>一句话记住它的身份：<b>微量调节兵 + 不供能 + 不建身 + 缺了就出毛病</b>。</p>\n    <div class=\"card tip\"><b>核心：</b>维生素是微量营养素，身体需要量极少（mg/μg级）。它<b>不供能、不构成组织</b>，主要起调节作用（当辅酶、抗氧化、管视觉/凝血/骨代谢等）。种类多，每一种管一摊事。</div>\n    <div class=\"mnemonic\">维生素是调节兵，微量用量管平衡；不供能来不建身，缺它小病一个挨。<small>和\"三大产能营养素\"（蛋白脂类碳水）分工不同：它管调节，不管加油、不管盖房。</small></div>"},{"id":"vtype","title":"👬 两大阵营：脂溶 vs 水溶","tag":"第2站 · 分两类","narr":"维生素分两大家，看它\"溶在哪\"：①脂溶性维生素——溶解在脂肪里，跟着油脂一起被肠道吸收，能在肝脏和脂肪里\"囤货\"长期存着；代表是 A、D、E、K。好处是省着用，坏处是吃太多（尤其A、D）排不出去、会蓄积中毒。②水溶性维生素——溶解在水里，吸收后多余的部分随尿排出、基本不囤；代表是 B 族维生素（B1 B2 B6 B12 烟酸 叶酸…）和维生素 C。好处是不容易中毒，坏处是要经常吃、容易从尿里流失。口诀：脂溶ADEK存体内，水溶B和C随尿排；脂溶多了会中毒，水溶常补才不缺。","html":"<div class=\"case\">\n      <div class=\"case-title\">👬 案例图：维生素两大阵营（溶在哪、存多久）</div>\n      <svg viewBox=\"0 0 680 200\" role=\"img\" aria-label=\"脂溶性与水溶性维生素\">\n        <rect x=\"16\" y=\"22\" width=\"316\" height=\"156\" rx=\"14\" fill=\"#fff7ec\" stroke=\"#ffb347\" stroke-width=\"2\"/>\n        <text x=\"174\" y=\"62\" font-size=\"30\" text-anchor=\"middle\">🛢️</text>\n        <text x=\"174\" y=\"94\" font-size=\"15\" text-anchor=\"middle\" fill=\"#9a6310\" font-weight=\"bold\" font-family=\"SimSun,serif\">① 脂溶性 A D E K</text>\n        <text x=\"174\" y=\"118\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">溶脂肪·随油吸收</text>\n        <text x=\"174\" y=\"142\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#b33232\" font-family=\"SimSun,serif\">体内囤货·过量易中毒</text>\n        <rect x=\"348\" y=\"22\" width=\"316\" height=\"156\" rx=\"14\" fill=\"#eaf1fb\" stroke=\"#3a86ff\" stroke-width=\"2\"/>\n        <text x=\"506\" y=\"62\" font-size=\"30\" text-anchor=\"middle\">💧</text>\n        <text x=\"506\" y=\"94\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1f5bb5\" font-weight=\"bold\" font-family=\"SimSun,serif\">② 水溶性 B族 + C</text>\n        <text x=\"506\" y=\"118\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">溶水·随尿排出</text>\n        <text x=\"506\" y=\"142\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-family=\"SimSun,serif\">基本不囤·需常补</text>\n      </svg>\n      <div class=\"case-cap\">一句话分家：溶脂肪会囤（ADEK），溶水会排（B+C）；这决定了\"会不会中毒、要不要常吃\"。</div>\n    </div>\n    <div class=\"mnemonic\">脂溶ADEK存体内，水溶B和C随尿排；脂溶多了会中毒，水溶常补才不缺。<small>脂溶性靠油脂吸收、在肝/脂肪储存；水溶性多余随尿走、不易蓄积。</small></div>"},{"id":"vfat","title":"🛡️ 脂溶性四兄弟：A D E K","tag":"第3站 · 脂溶家族","narr":"脂溶性四兄弟，每人一本领，记四句：① 维生素A（视黄醇）——管眼睛（尤其暗视力）、上皮细胞和免疫；来源动物肝脏、蛋黄、奶，植物里的β-胡萝卜素（橙黄蔬果：胡萝卜、南瓜、红薯）能在体内变成A；缺了会夜盲、干眼。② 维生素D——管钙磷吸收、骨头硬朗；来源晒太阳皮肤自己合成、鱼肝油、蛋黄、强化奶；缺了小孩佝偻病、大人骨软化。③ 维生素E——抗氧化，保护细胞膜上的不饱和脂肪酸；来源植物油、坚果、种子；缺了很少见。④ 维生素K——管凝血（伤口止血）和骨；来源绿叶菜（菠菜）、肠道细菌也能造一点；缺了容易出血不止。口诀：A眼D骨E抗氧，K管凝血记心房；脂溶存体易积蓄，补多反而要中伤。","html":"<div class=\"case\">\n      <div class=\"case-title\">🛡️ 案例图：脂溶性四兄弟（A D E K 各管一摊）</div>\n      <svg viewBox=\"0 0 680 188\" role=\"img\" aria-label=\"脂溶性维生素ADEK\">\n        <rect x=\"14\" y=\"18\" width=\"156\" height=\"152\" rx=\"14\" fill=\"#fff7ec\" stroke=\"#ffb347\" stroke-width=\"2\"/>\n        <text x=\"92\" y=\"58\" font-size=\"28\" text-anchor=\"middle\">👁️</text>\n        <text x=\"92\" y=\"90\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#9a6310\" font-weight=\"bold\" font-family=\"SimSun,serif\">维A(视黄醇)</text>\n        <text x=\"92\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">护眼·上皮·免疫</text>\n        <text x=\"92\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">肝脏蛋黄胡萝卜素</text>\n        <rect x=\"178\" y=\"18\" width=\"156\" height=\"152\" rx=\"14\" fill=\"#eafaf1\" stroke=\"#39b27c\" stroke-width=\"2\"/>\n        <text x=\"256\" y=\"58\" font-size=\"28\" text-anchor=\"middle\">🦴</text>\n        <text x=\"256\" y=\"90\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-weight=\"bold\" font-family=\"SimSun,serif\">维D</text>\n        <text x=\"256\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">抓钙磷·强骨</text>\n        <text x=\"256\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">晒太阳·鱼肝油蛋黄</text>\n        <rect x=\"342\" y=\"18\" width=\"156\" height=\"152\" rx=\"14\" fill=\"#eaf1fb\" stroke=\"#3a86ff\" stroke-width=\"2\"/>\n        <text x=\"420\" y=\"58\" font-size=\"28\" text-anchor=\"middle\">🛡️</text>\n        <text x=\"420\" y=\"90\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#1f5bb5\" font-weight=\"bold\" font-family=\"SimSun,serif\">维E</text>\n        <text x=\"420\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">抗氧化·护细胞膜</text>\n        <text x=\"420\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">植物油·坚果种子</text>\n        <rect x=\"506\" y=\"18\" width=\"160\" height=\"152\" rx=\"14\" fill=\"#fff3f0\" stroke=\"#ff7a59\" stroke-width=\"2\"/>\n        <text x=\"586\" y=\"58\" font-size=\"28\" text-anchor=\"middle\">🩸</text>\n        <text x=\"586\" y=\"90\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#b5431f\" font-weight=\"bold\" font-family=\"SimSun,serif\">维K</text>\n        <text x=\"586\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">凝血·骨健康</text>\n        <text x=\"586\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">绿叶菜·肠道菌造</text>\n      </svg>\n      <div class=\"case-cap\">A护眼、D强骨、E抗氧、K止血——四位各管一摊；都靠油脂吸收、能囤，补多要当心。</div>\n    </div>\n    <div class=\"mnemonic\">A眼D骨E抗氧，K管凝血记心房；脂溶存体易积蓄，补多反而要中伤。<small>维A缺→夜盲/干眼；维D缺→小儿佝偻病、成人骨软化；维K缺→出血不止。</small></div>"},{"id":"vwater","title":"💧 水溶性家族：B族 + 维生素C","tag":"第4站 · 水溶家族","narr":"水溶性家族有两大块：B 族维生素 + 维生素 C。B 族是个\"大家族\"，成员多、都管能量代谢和神经细胞，重点记四位：① B1（硫胺素）——帮糖变成能量，护神经；粗粮、瘦肉、豆类里有；缺了得\"脚气病\"（不是脚臭，是腿肿、心慌、没劲）。② B2（核黄素）——管黏膜和能量；奶、蛋、肝、绿叶菜有；缺了口角炎、嘴唇裂、舌头红。③ 烟酸（B3，又叫PP）——也管能量；肝、肉、花生、玉米（要碱处理释放）有；缺了得\"癞皮病\"（皮炎、腹泻、痴呆）。④ 叶酸（B9）和 B12——管红细胞和 DNA、护神经；叶酸在绿叶菜肝豆里，B12只在肉蛋奶里（素食者易缺）；缺了得巨幼红细胞贫血。还有维生素C（抗坏血酸）——造胶原、抗氧化、帮铁吸收、护免疫；新鲜蔬果（柑橘、猕猴桃、青椒）有；缺了坏血病（牙龈出血、伤口难愈）。口诀：B1脚气B2炎，烟酸癞皮叶酸贫血B12神；维C抗氧帮铁吸，缺了坏血牙龈烂。","html":"<div class=\"case\">\n      <div class=\"case-title\">💧 案例图：水溶性家族（B族四位 + 维C）</div>\n      <svg viewBox=\"0 0 680 200\" role=\"img\" aria-label=\"水溶性维生素B族与C\">\n        <rect x=\"12\" y=\"18\" width=\"156\" height=\"164\" rx=\"14\" fill=\"#fff8e6\" stroke=\"#ffb347\" stroke-width=\"2\"/>\n        <text x=\"90\" y=\"56\" font-size=\"26\" text-anchor=\"middle\">🌾</text>\n        <text x=\"90\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#9a6310\" font-weight=\"bold\" font-family=\"SimSun,serif\">B1硫胺素</text>\n        <text x=\"90\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">糖→能量·护神经</text>\n        <text x=\"90\" y=\"136\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">粗粮瘦肉豆</text>\n        <text x=\"90\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b33232\" font-family=\"SimSun,serif\">缺→脚气病</text>\n        <rect x=\"176\" y=\"18\" width=\"156\" height=\"164\" rx=\"14\" fill=\"#fff3f0\" stroke=\"#ff7a59\" stroke-width=\"2\"/>\n        <text x=\"254\" y=\"56\" font-size=\"26\" text-anchor=\"middle\">👄</text>\n        <text x=\"254\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#b5431f\" font-weight=\"bold\" font-family=\"SimSun,serif\">B2核黄素</text>\n        <text x=\"254\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">黏膜·能量</text>\n        <text x=\"254\" y=\"136\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">奶蛋肝绿叶</text>\n        <text x=\"254\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b33232\" font-family=\"SimSun,serif\">缺→口角炎</text>\n        <rect x=\"340\" y=\"18\" width=\"156\" height=\"164\" rx=\"14\" fill=\"#eafaf1\" stroke=\"#39b27c\" stroke-width=\"2\"/>\n        <text x=\"418\" y=\"56\" font-size=\"26\" text-anchor=\"middle\">🌽</text>\n        <text x=\"418\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-weight=\"bold\" font-family=\"SimSun,serif\">烟酸B3(PP)</text>\n        <text x=\"418\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">能量代谢</text>\n        <text x=\"418\" y=\"136\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">肝肉花生玉米</text>\n        <text x=\"418\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b33232\" font-family=\"SimSun,serif\">缺→癞皮病</text>\n        <rect x=\"504\" y=\"18\" width=\"164\" height=\"164\" rx=\"14\" fill=\"#eaf1fb\" stroke=\"#3a86ff\" stroke-width=\"2\"/>\n        <text x=\"586\" y=\"56\" font-size=\"26\" text-anchor=\"middle\">🍊</text>\n        <text x=\"586\" y=\"88\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1f5bb5\" font-weight=\"bold\" font-family=\"SimSun,serif\">叶酸B9·B12·维C</text>\n        <text x=\"586\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">红血球·神经·胶原</text>\n        <text x=\"586\" y=\"136\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">绿叶·肝·肉·蔬果</text>\n        <text x=\"586\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b33232\" font-family=\"SimSun,serif\">缺→贫血/坏血</text>\n      </svg>\n      <div class=\"case-cap\">B族管能量和神经细胞，维C管胶原和免疫；都溶于水、随尿排，要常吃。</div>\n    </div>\n    <div class=\"mnemonic\">B1脚气B2炎，烟酸癞皮叶酸贫血B12神；维C抗氧帮铁吸，缺了坏血牙龈烂。<small>B1缺→脚气病(神经心冲)；B2缺→口角唇舌炎；烟酸缺→癞皮病(皮泻呆)；叶酸/B12缺→巨幼贫血；C缺→坏血病。</small></div>"},{"id":"vsrc","title":"🍽️ 维生素从哪来？","tag":"第5站 · 食物来源","narr":"维生素从哪来？记住\"彩虹餐盘 + 几样重点\"：① 维A——动物肝脏、蛋黄、奶；植物β-胡萝卜素在橙黄红绿蔬果（胡萝卜、南瓜、红薯、菠菜）。② 维D——多晒太阳（皮肤合成），吃鱼肝油、蛋黄、强化奶；食物来源少，北方冬天晒太阳少要注意。③ 维E——植物油、坚果、种子。④ 维K——绿叶菜（菠菜、西兰花）、肠道菌也能造。⑤ B族——粗粮、瘦肉、肝、蛋、奶、绿叶菜、豆类。⑥ 维C——新鲜蔬果（柑橘、猕猴桃、草莓、青椒、番茄），怕热怕煮久，生吃或急火快炒最好。口诀：肝脏蛋黄胡萝卜，维A满满夜里明；晒太阳吃鱼肝油，维D强骨不用愁；蔬果坚果全谷豆，B和C来不用忧。","html":"<div class=\"case\">\n      <div class=\"case-title\">🍽️ 案例图：小明一天维生素餐盘</div>\n      <svg viewBox=\"0 0 680 178\" role=\"img\" aria-label=\"小明一天维生素餐盘\">\n        <rect x=\"20\" y=\"22\" width=\"300\" height=\"134\" rx=\"14\" fill=\"#fff7ec\" stroke=\"#ffb347\" stroke-width=\"2\"/>\n        <text x=\"170\" y=\"58\" font-size=\"26\" text-anchor=\"middle\">🥕🥬🍳</text>\n        <text x=\"170\" y=\"92\" font-size=\"14\" text-anchor=\"middle\" fill=\"#9a6310\" font-weight=\"bold\" font-family=\"SimSun,serif\">蔬果 + 蛋奶 + 肝</text>\n        <text x=\"170\" y=\"116\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">维A(胡萝卜素)·B族·维D·维C</text>\n        <text x=\"170\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">彩虹蔬果最给力</text>\n        <rect x=\"348\" y=\"22\" width=\"312\" height=\"134\" rx=\"14\" fill=\"#eafaf1\" stroke=\"#39b27c\" stroke-width=\"2\"/>\n        <text x=\"504\" y=\"58\" font-size=\"26\" text-anchor=\"middle\">🌻🥜🍞</text>\n        <text x=\"504\" y=\"92\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-weight=\"bold\" font-family=\"SimSun,serif\">坚果 + 植物油 + 粗粮</text>\n        <text x=\"504\" y=\"116\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">维E·维K·B族·维C</text>\n        <text x=\"504\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">晒太阳补维D·维C怕热</text>\n        <text x=\"340\" y=\"172\" font-size=\"13\" text-anchor=\"middle\" fill=\"#23303f\" font-family=\"SimSun,serif\">彩虹蔬果 + 蛋奶豆 + 坚果粗粮 + 晒太阳 = 维生够</text>\n      </svg>\n      <div class=\"case-cap\">没有哪种食物含全所有维生，靠\"杂\"和\"彩虹\"凑齐最重要。</div>\n    </div>\n    <div class=\"mnemonic\">肝脏蛋黄胡萝卜，维A满满夜里明；晒太阳吃鱼肝油，维D强骨不用愁；蔬果坚果全谷豆，B和C来不用忧。<small>维C怕热怕煮久，蔬果生吃/急火快炒最保住。</small></div>"},{"id":"vmyth","title":"🚫 三个常见误区","tag":"第6站 · 避坑","narr":"最后拆三个常见误区：误区1：\"维生素补得越多越健康\"——错！脂溶性 A、D 吃太多会在体内蓄积中毒（比如维A过量掉发、肝伤；维D过量血钙高）；水溶性虽多随尿排，但B6、烟酸猛吃也会不舒服。除医生确诊缺乏，别盲目猛吃补充剂。误区2：\"维C治感冒\"——错！维C能帮免疫、长期吃或缩短一点感冒时长，但<b>不能预防也不能治好</b>感冒，靠它当药不靠谱。误区3：\"只吃蔬果就能补够所有维生\"——错！维D主要晒太阳、B12只存在于动物性食物（纯素食者易缺B12）、维A的视黄醇在动物肝。要\"荤素 + 彩虹 + 晒太阳\"才全。口诀：脂溶补多会中毒，维C不治感冒病；蔬果虽好不全有，荤素彩虹加晒日。","html":"<div class=\"case\">\n      <div class=\"case-title\">🚫 案例图：维生素三个误区（❌误区 vs ✅正解）</div>\n      <svg viewBox=\"0 0 680 188\" role=\"img\" aria-label=\"维生素误区对比\">\n        <rect x=\"16\" y=\"20\" width=\"200\" height=\"148\" rx=\"14\" fill=\"#fdeaea\" stroke=\"#e06b6b\" stroke-width=\"2\"/>\n        <text x=\"116\" y=\"50\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#b33232\" font-weight=\"bold\" font-family=\"SimSun,serif\">❌ 误区1</text>\n        <text x=\"116\" y=\"82\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">补得越多越健康</text>\n        <text x=\"116\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">脂溶A/D蓄积中毒</text>\n        <text x=\"116\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">不缺别猛吃补剂</text>\n        <text x=\"116\" y=\"156\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-family=\"SimSun,serif\">✅食补优先</text>\n        <rect x=\"240\" y=\"20\" width=\"200\" height=\"148\" rx=\"14\" fill=\"#fdeaea\" stroke=\"#e06b6b\" stroke-width=\"2\"/>\n        <text x=\"340\" y=\"50\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#b33232\" font-weight=\"bold\" font-family=\"SimSun,serif\">❌ 误区2</text>\n        <text x=\"340\" y=\"82\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">维C治感冒</text>\n        <text x=\"340\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">只助免疫·不治病</text>\n        <text x=\"340\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">当药不靠谱</text>\n        <text x=\"340\" y=\"156\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-family=\"SimSun,serif\">✅不能防/治</text>\n        <rect x=\"464\" y=\"20\" width=\"200\" height=\"148\" rx=\"14\" fill=\"#fdeaea\" stroke=\"#e06b6b\" stroke-width=\"2\"/>\n        <text x=\"564\" y=\"50\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#b33232\" font-weight=\"bold\" font-family=\"SimSun,serif\">❌ 误区3</text>\n        <text x=\"564\" y=\"82\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">只吃蔬果就够</text>\n        <text x=\"564\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">缺维D/B12(动物)</text>\n        <text x=\"564\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b6b7c\" font-family=\"SimSun,serif\">素食者易缺B12</text>\n        <text x=\"564\" y=\"156\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1c7a4d\" font-family=\"SimSun,serif\">✅荤素+晒日</text>\n      </svg>\n      <div class=\"case-cap\">三个误区都绕开，维生素才算吃对、补对。</div>\n    </div>\n    <div class=\"mnemonic\">脂溶补多会中毒，维C不治感冒病；蔬果虽好不全有，荤素彩虹加晒日。<small>误区：越多越补、维C治感冒、只吃蔬果就够——全错。</small></div>"},{"id":"feynman","title":"🗣️ 费曼自检","tag":"第12站 · 费曼法","narr":"学没学会，用费曼法检验：假装把知识讲给奶奶听。能讲明白，才是真懂。\n    这一站，请你用自己的话，回答下面四个问题，并给自己打星。讲得越像\"大白话\"，分越高。","html":"\n      <p class=\"lead\">费曼学习法：用自己的话讲出来，才是真懂。</p>\n      <ul class=\"feynman-list\">\n        <li>① 用一句话说清：注册营养师 和 公共营养师 有什么区别？</li>\n        <li>② 报出七大营养素的名字，并各举一个作用。</li>\n        <li>③ 举出钙、铁、碘 其中一个的作用，和哪类食物里多。</li>\n        <li>④ 蔬菜和水果能不能互相代替？每天大概吃多少？</li>\n        <li>⑤ 用一句话说清：人为什么会胖会瘦？能量从哪来、烧到哪去？</li>\n        <li>⑥ 脂类分成哪几类？它除了供能，还有什么重要作用？</li>\n      </ul>\n      <button class=\"btn\" onclick=\"openFeynman()\">✍️ 开始费曼自检（打分+存档）</button>\n    "},{"id":"xiaoming","title":"🙋 小明来提问","tag":"第13站 · 课堂互动","narr":"我的学生小明，总爱问些\"灵魂问题\"。这一站，换小明考你——看看你是不是真听明白了。","html":"\n      <div class=\"card ask\"><b>小明：</b>\"老师，注册和公共营养师到底差在哪啊？我老是分不清！还有蔬菜水果到底吃多少？\"</div>\n      <p>来，点下面按钮，和小明过招 👇</p>\n      <button class=\"btn\" onclick=\"openXiaoMing()\">🙋 进入小明问答（4题）</button>\n    "},{"id":"quiz","title":"🏆 终极测验","tag":"第14站 · 测验","narr":"最后一站，终极测验！把前面的口诀和知识点串起来考一考。答完看看自己能拿几颗星。","html":"\n      <p class=\"lead\">综合前面所有知识点，来一场小测验。</p>\n      <button class=\"btn\" onclick=\"openQuiz(6)\">🏆 开始终极测验（6题）</button>\n      <div class=\"mnemonic\">通关口诀合集（背熟这些！）<small>\n        注册有证真专业，公共入门好起点；<br>\n        医生开药治已病，营养师开菜单防未病；<br>\n        评估定制加临床，公共卫生也来帮；<br>\n        基础食物加人群，临床公卫四块拼；<br>\n        蛋脂碳维矿水纤，七兄弟把健康连；<br>\n        钙建骨，铁运氧，碘管甲，锌长壮；<br>\n        孕妇补叶酸，神经管不亏；<br>\n        人群不同吃法异，对号入座才适宜；<br>\n        红橙绿紫白，五色都来点；<br>\n        每天一斤菜，半斤果，深色蔬菜占一半；<br>\n        蛋白碳水各四卡，脂肪独吞九卡家；<br>\n        一大卡换四点一八，千焦千卡是一家；<br>\n        基础代谢是大头，活动消化也烧油；<br>\n        进多出少会囤肉，进少出多自然瘦；\n        甘油磷脂固醇三，能量膜材激素源；\n        脂溶 A D E K，油车送进身体里；\n        亚油亚麻两必需，身体不能自己齐；\n        鱼禽豆果好油多，肥肉奶油坏油躲；\n        反式脂肪酸最要躲，加工零食少碰我！\n      </small></div>\n    "}];
const QUIZ = [{"q":"维生素在身体里主要起什么作用？","opts":["调节代谢（当辅酶/抗氧化/视觉/凝血等），不供能、不建身","当主要燃料供能","构成肌肉骨骼等大结构","只通肠道"],"a":0,"e":"维生素是微量调节兵：不供能、不构成组织，主要起调节作用（辅酶、抗氧化、视觉、凝血、骨代谢）。"},{"q":"下列属于\"脂溶性维生素\"的是？","opts":["A、D、E、K","B1、B2、C","只有蛋白质","只有水"],"a":0,"e":"脂溶性维生素 = A、D、E、K（溶于脂肪、随油吸收、体内储存）。"},{"q":"脂溶性维生素的特点是？","opts":["溶脂肪、随油吸收、在肝/脂肪储存、过量易蓄积中毒","溶于水、随尿排、不储存","完全不吸收","只存在于肉里"],"a":0,"e":"脂溶性靠油脂吸收、在体内储存，所以 A、D 补太多会蓄积中毒；水溶才随尿排。"},{"q":"维生素A（视黄醇）的作用和缺乏表现是？","opts":["护眼(暗视力)/上皮/免疫；缺→夜盲、干眼","强骨抓钙；缺→佝偻病","抗氧化护膜；缺→坏血","凝血；缺→出血不止"],"a":0,"e":"维A管视觉(尤其暗视力)、上皮、免疫；来源肝/蛋黄/奶+植物β-胡萝卜素；缺乏致夜盲、干眼。"},{"q":"关于维生素D，正确的是？","opts":["促进钙磷吸收、强骨；主要靠晒太阳皮肤合成，缺→小儿佝偻病/成人骨软化","只存在于白米饭","越多越减肥","和眼睛有关"],"a":0,"e":"维D促钙磷吸收、维护骨健康；来源晒太阳+鱼肝油/蛋黄/强化奶；缺乏致佝偻病(儿)、骨软化(成人)。"},{"q":"水溶性维生素的特点是？","opts":["溶于水、多余随尿排出、基本不储存、需常吃","溶脂肪、体内囤货、过量易中毒","完全不吸收","只在植物里"],"a":0,"e":"水溶性(B族+C)溶于水、多余随尿排、不易蓄积中毒，但容易流失要常吃（B12较特殊，可在肝储存）。"},{"q":"维生素B1（硫胺素）缺乏会导致？","opts":["脚气病（神经/心血管症状，不是脚臭）","坏血病","佝偻病","夜盲症"],"a":0,"e":"B1缺→脚气病（下肢水肿、心悸、乏力等神经心血管表现），并非脚臭；来源粗粮瘦肉豆类。"},{"q":"维生素C（抗坏血酸）缺乏会导致？它主要来自？","opts":["坏血病（牙龈出血、伤口难愈）；新鲜蔬果（柑橘/猕猴桃/青椒）","夜盲；只在动物肝","佝偻病；白米饭","癞皮病；玉米"],"a":0,"e":"维C缺→坏血病；来源新鲜蔬果，怕热怕久煮，生吃/急火快炒最保住；还帮铁吸收、抗氧化。"},{"q":"关于\"维C能治感冒\"，正确的是？","opts":["不能预防也不能治好，只辅助免疫；靠它当药不靠谱","能立刻治好感冒","能百分百预防感冒","感冒只靠维C就行"],"a":0,"e":"维C有助免疫、长期适量或略缩短感冒时长，但不能预防也不能治愈感冒。"}];
const XM = [{"q":"小明：老师，维生素是药吗？和我之前学的蛋白质有啥不一样？","opts":["维生素是\"微量调节兵\"：不供能、不建身，只管调节（辅酶/抗氧化/视觉/凝血等）；蛋白是砖块，长身体","维生素就是药，多吃没害","维生素和蛋白质完全一样","维生素一点用没有"],"a":0,"e":"晓晓老师：维生素用量极少、只管调节，和蛋白质（砖块、长身体）分工不同——它不顶饿也不盖房，但缺了出毛病。"},{"q":"小明：我妈天天让我吃维C片防感冒，到底有用没？","opts":["维C不能预防也不能治感冒，只辅助免疫；食补（蔬果）优先，不缺别猛吃补剂","维C能立刻治好感冒","维C百分百防感冒","感冒只吃维C就行"],"a":0,"e":"晓晓老师：维C帮免疫、或略缩短感冒，但既不能防也不能治感冒；正常吃蔬果就够，别当药猛吃。"},{"q":"小明：那我只吃蔬菜水果不吃肉，维生素够不够？","opts":["不够全；维D主要靠晒太阳、B12只存在于动物性食物(素食易缺B12)、视黄醇在动物肝；要荤素+彩虹+晒太阳","完全够，蔬果最全","肉里一点维生都没有","只吃蔬果最健康"],"a":0,"e":"晓晓老师：蔬果给维A原/B/C/K/E很棒，但维D靠日晒、B12只在肉蛋奶、视黄醇在肝；纯素易缺B12，要\"荤素+彩虹+晒太阳\"才齐。"}];
let cur=0, sentIdx=0, playing=false, score=0, quizDone=new Set(), xmDone=new Set(), feynmanDone=false, curRate=1;
let timerOn=true, timerH=null, synth=null, voice=null, speaking=false;

const $ = s=>document.querySelector(s);
const slideEl=$('#slide'), progEl=$('#prog'), scoreEl=$('#score'), subEl=$('#subtxt');

function splitSentences(t){
  if(!t) return [''];
  const parts = t.split(/(?<=[。！？；])/).map(s=>s.trim()).filter(s=>s.length>0);
  return parts.length ? parts : [t];
}

function render(){
  const L=LESSONS[cur];
  slideEl.innerHTML = `<h2>${L.title} <span class="tag">${L.tag}</span></h2>${L.html}`;
  progEl.style.width = ((cur+1)/LESSONS.length*100)+'%';
  // 导航
  const nm=$('#navmap'); nm.innerHTML='';
  LESSONS.forEach((x,i)=>{
    const b=document.createElement('button');
    b.textContent=(i===0?'🏠':(i+1)+'.')+x.title.replace(/^[^\s]+\s/,'');
    if(i===cur)b.className='active'; else if(i<cur||quizDone.has(i))b.className='done';
    b.onclick=()=>{ stopSpeak(); playing=false; cur=i; sentIdx=0; render(); };
    nm.appendChild(b);
  });
  // 上一页/下一页
  const pager=document.createElement('div'); pager.className='pager';
  pager.innerHTML=`<button class="btn" ${cur===0?'disabled':''} onclick="go(-1)">← 上一页</button>
    <button class="btn" style="background:var(--brand);color:#fff" ${cur===LESSONS.length-1?'disabled':''} onclick="go(1)">下一页 →</button>`;
  slideEl.appendChild(pager);
  updateSentBar();
  updateSub();
}
function go(d){ stopSpeak(); playing=false; cur=Math.max(0,Math.min(LESSONS.length-1,cur+d)); sentIdx=0; render(); }

/* —— 句子级播放（支持上一句/下一句/点击跳句 = 自由调播放位置） —— */
function updateSub(){
  const sents=splitSentences(LESSONS[cur].narr);
  subEl.textContent = (sentIdx<sents.length)? sents[sentIdx] : LESSONS[cur].narr;
  $('#posTxt').textContent='句 '+(sents.length?Math.min(sentIdx+1,sents.length):0)+'/'+sents.length;
}
function updateSentBar(){
  const sents=splitSentences(LESSONS[cur].narr);
  const bar=$('#sentbar'); bar.innerHTML='';
  sents.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='seg'+(i===sentIdx?' on':'')+(i<sentIdx?' done':'');
    b.title=s; b.textContent=(i+1);
    b.onclick=()=>{ playing=false; speakSentence(i); };
    bar.appendChild(b);
  });
  $('#posTxt').textContent='句 '+(sents.length?Math.min(sentIdx+1,sents.length):0)+'/'+sents.length;
}
function updatePlayUI(){
  $('#playS').textContent = playing? '⏸ 暂停' : '▶ 播放';
  $('#playBtn').textContent = playing? '⏸ 暂停本课' : '▶ 听晓晓老师讲（本课）';
}
function speakSentence(i){
  const sents=splitSentences(LESSONS[cur].narr);
  if(i<0||i>=sents.length) return;
  sentIdx=i;
  stopSpeak();
  updateSub(); updateSentBar(); updatePlayUI();
  if(!('speechSynthesis' in window)) return; // 无语音也能看字幕
  const u=new SpeechSynthesisUtterance(sents[i]);
  u.lang='zh-CN'; u.rate=curRate; u.pitch=1.0;
  if(voice)u.voice=voice;
  u.onstart=()=>{ speaking=true; };
  u.onend=()=>{
    speaking=false;
    if(playing && sentIdx < sents.length-1){ sentIdx++; speakSentence(sentIdx); }
    else if(playing && sentIdx===sents.length-1){ playing=false; updatePlayUI(); }
  };
  synth.speak(u);
}
function playLesson(){ stopSpeak(); sentIdx=0; playing=true; speakSentence(0); }

/* —— 语音初始化 —— */
function setupVoices(){
  const sel=$('#voiceSel'); sel.innerHTML='';
  const vs=speechSynthesis.getVoices();
  const zh=vs.filter(v=>/zh|chinese|中文|国语|普通话/i.test(v.lang+v.name));
  let best=null;
  zh.forEach(v=>{ if(/xiao|晓|neural|神经|online|yun/i.test(v.name)) best=best||v; });
  voice = best || zh[0] || vs[0] || null;
  zh.concat(vs).forEach((v,i)=>{
    if(i>40)return;
    const o=document.createElement('option'); o.value=i; o.textContent=v.name+' ('+v.lang+')';
    if(v===voice)o.selected=true; sel.appendChild(o);
  });
  sel.onchange=()=>{ voice = speechSynthesis.getVoices()[+sel.value]||voice; };
}
function stopSpeak(){ if(synth&&synth.speaking) synth.cancel(); speaking=false; }

$('#playBtn').onclick=()=>{ if(playing){ playing=false; stopSpeak(); updatePlayUI(); } else { playLesson(); } };
$('#playS').onclick=()=>{
  if(playing){ playing=false; stopSpeak(); updatePlayUI(); }
  else { playing=true; const sents=splitSentences(LESSONS[cur].narr);
    if(sentIdx>=sents.length-1) sentIdx=0; speakSentence(sentIdx); }
};
$('#prevS').onclick=()=>{
  playing=false;
  const sents=splitSentences(LESSONS[cur].narr);
  if(sentIdx>0) speakSentence(sentIdx-1);
  else if(cur>0){ go(-1); const s2=splitSentences(LESSONS[cur].narr); speakSentence(s2.length-1); }
  else speakSentence(0);
};
$('#nextS').onclick=()=>{
  playing=false;
  const sents=splitSentences(LESSONS[cur].narr);
  if(sentIdx<sents.length-1) speakSentence(sentIdx+1);
  else if(cur<LESSONS.length-1){ go(1); speakSentence(0); }
  else updateSub();
};
$('#rollBtn').onclick=()=>openQuiz(1,true);
$('#rateSel').onchange=()=>{ curRate=parseFloat($('#rateSel').value)||1; if(speaking) speakSentence(sentIdx); };
$('#timerBtn').onclick=()=>{ timerOn=!timerOn; $('#timerBtn').classList.toggle('on',timerOn);
  $('#timerBtn').textContent= timerOn?'⏰ 不定时提问':'⏰ 已关'; if(timerOn) startTimer(); else { clearTimeout(timerH); } };
// 不定时：随机 35~70 秒，有时抽题、有时来一句费曼快速回忆
function startTimer(){
  clearTimeout(timerH); if(!timerOn)return;
  const loop=()=>{
    if(document.querySelector('.mask.show')){ schedule(); return; }
    if(Math.random()<0.72) openQuiz(1,true); else openRecall();
    schedule();
  };
  const schedule=()=>{ const t=35000+Math.random()*35000; timerH=setTimeout(loop,t); };
  schedule();
}

/* —— 弹窗通用 —— */
function showModal(html){ $('#modal').innerHTML=html; $('#mask').classList.add('show'); }
function closeModal(){ $('#mask').classList.remove('show'); stopSpeak(); }
$('#mask').onclick=(e)=>{ if(e.target.id==='mask') closeModal(); };

function addScore(n,msg){ score+=n; scoreEl.textContent=score; toast(msg+' +'+n+'⭐'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* —— 测验 —— */
function openQuiz(n, random){
  const pool = random ? QUIZ : QUIZ.slice();
  const picked=[]; const copy=pool.slice();
  for(let i=0;i<n && copy.length;i++){ picked.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  let idx=0, correct=0;
  function step(){
    if(idx>=picked.length){ finish(); return; }
    const Q=picked[idx];
    showModal(`<h3>📝 第 ${idx+1}/${picked.length} 题</h3>
      <div class="who">晓晓老师提问时间</div>
      <p><b>${Q.q}</b></p>
      ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
      <div class="explain" id="ex"></div>
      <div class="row"><button class="btn" onclick="closeModal()">关闭</button></div>`);
    $('#modal').querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.i; const opts=$('#modal').querySelectorAll('.opt');
        opts.forEach(o=>o.disabled=true);
        if(i===Q.a){ b.classList.add('correct'); correct++; }
        else { b.classList.add('wrong'); opts[Q.a].classList.add('correct'); }
        const ex=$('#ex'); ex.innerHTML='✅ 解析：'+Q.e; ex.classList.add('show');
        if(i===Q.a) addScore(10,'答对啦');
      };
    });
  }
  function finish(){
    const star = '⭐'.repeat(Math.max(1,Math.round(correct/picked.length*5)));
    showModal(`<h3>🏁 测验结束</h3><div class="who">本次答对 ${correct}/${picked.length}</div>
      <p style="font-size:22px">${star}</p>
      <p>累计得分：<b>${score} ⭐</b></p>
      <div class="row"><button class="btn" style="background:var(--brand);color:#fff" onclick="closeModal()">好的</button>
      <button class="btn" onclick="openQuiz(${n},${random})">再来一次</button></div>`);
    quizDone.add(cur); render();
  }
  step();
}

/* —— 复习站小测 —— */

    $('#modal').querySelectorAll('.opt').forEach(b=>{

        opts.forEach(o=>o.disabled=true);
        if(i===Q.a){ b.classList.add('correct'); correct++; }

      <div class="row"><button class="btn" style="background:var(--brand);color:#fff" onclick="closeModal()">继续</button>
      <button class="btn" onclick="closeModal()">去学新课 ➜</button></div>`);
  }
  step();
}

    if(idx>=XM.length){ finish(); return; }
    const Q=XM[idx];
    showModal(`<h3>🙋 小明的问题 ${idx+1}/${XM.length}</h3>
      <div class="who" style="color:var(--brand);font-weight:700">${Q.q}</div>
      ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
      <div class="explain" id="ex"></div>
      <div class="row"><button class="btn" onclick="closeModal()">关闭</button></div>`);
    $('#modal').querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.i; const opts=$('#modal').querySelectorAll('.opt');
        opts.forEach(o=>o.disabled=true);
        if(i===Q.a){ b.classList.add('correct'); correct++; }
        else { b.classList.add('wrong'); opts[Q.a].classList.add('correct'); }
        const ex=$('#ex'); ex.innerHTML='💡 '+Q.e; ex.classList.add('show');
        if(i===Q.a) addScore(8,'小明服气了');
        idx++;
        setTimeout(()=>{ if(idx<XM.length) step(); else finish(); }, 900);
      };
    });
  }
  function finish(){
    showModal(`<h3>🎉 小明被你说服啦</h3><div class="who">答对 ${correct}/${XM.length}</div>
      <p>累计得分：<b>${score} ⭐</b></p>
      <div class="row"><button class="btn" style="background:var(--brand);color:#fff" onclick="closeModal()">返回课堂</button>
      <button class="btn" onclick="openXiaoMing()">再战</button></div>`);
    xmDone.add(cur); render();
  }
  step();
}

/* ===================== 启动 ===================== */
window.addEventListener('DOMContentLoaded',()=>{
  if('speechSynthesis' in window){ synth=window.speechSynthesis; setupVoices();
    speechSynthesis.onvoiceschanged=setupVoices; }
  else { $('#playBtn').disabled=true; $('#playBtn').textContent='本浏览器不支持语音'; }
  render();
  startTimer();
});

</script>
</body>
